<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p>Please login to continue</p>

            <form action="home.html">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit">
                    Login
                </button>


                <p class="register">
                    Don't have an account?
                    <a href="#">
                        Register
                    </a>
                </p>

            </form>

        </div>

    </div>

</body>

</html>
